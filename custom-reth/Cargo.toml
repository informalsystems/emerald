[workspace]
# Keep this crate out of the parent workspace

[package]
name         = "custom-reth"
version      = "0.0.2"
edition      = "2021"
rust-version = "1.83"
license      = "Apache-2.0"
repository   = "https://github.com/informalsystems/emerald"
publish      = false

[dependencies]
# Reth dependencies, version ghcr.io/paradigmxyz/reth:v1.9.3
reth-ethereum            = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3", features = [ "node", "consensus", "evm", "cli" ] }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-primitives-traits   = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-engine-primitives   = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-node-api            = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-node-builder        = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-payload-primitives  = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth             = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-chainspec   = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-evm         = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v1.9.3" }
alloy-rpc-types-engine   = { version = "1.5.2" }


c-kzg = { version ="2.1.5"}
alloy-evm        = { version = "0.23.3" }
alloy-consensus  = "1.5.2"
alloy-primitives = "1.5.2"
tracing            = "0.1.41"
vergen      = "=9.0.4"
vergen-git2 = "=1.0.5"
revm             = { version = "31.0.2", default-features = false, features = ["std"] }
eyre = "0.6"

[[bin]]
name = "custom-reth"
path = "src/main.rs"

[patch.crates-io]
# alloy-evm 0.23.3 (pulled by reth v1.9.3) doesn't handle the `blob_base_fee`
# field added to BlockOverrides in alloy-rpc-types-eth >= 1.6.1. This patch
# adds `..` to the pattern to ignore unknown fields.
alloy-evm = { path = "vendor/alloy-evm" }
