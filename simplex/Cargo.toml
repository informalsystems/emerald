[package]
name = "emerald-simplex"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "emerald-simplex"
path = "src/bin/validator.rs"

[[bin]]
name = "emerald-simplex-setup"
path = "src/bin/setup.rs"

[[bin]]
name = "genesis-hash"
path = "src/bin/genesis_hash.rs"

[dependencies]
# Emerald dependencies - reuse existing infrastructure
malachitebft-eth-engine = { workspace = true }
malachitebft-eth-types = { workspace = true }
malachitebft-eth-cli = { workspace = true }

# Commonware dependencies for simplex consensus
commonware-broadcast = "0.0.65"
commonware-codec = "0.0.65"
commonware-consensus = { version = "0.0.65", features = ["mocks"] }
commonware-cryptography = { version = "0.0.65", features = ["mocks"] }
commonware-p2p = "0.0.65"
commonware-resolver = "0.0.65"
commonware-runtime = "0.0.65"
commonware-storage = "0.0.65"
commonware-utils = "0.0.65"
commonware-parallel = "0.0.65"
commonware-math = "0.0.65"

# Alloy for EVM types
alloy-primitives = { workspace = true }
alloy-rpc-types-engine = { workspace = true }
alloy-rlp = "0.3"
alloy-consensus = { workspace = true }
alloy-trie = "0.9"
alloy-genesis = "1.4.3"

# Serialization
bytes = { workspace = true }
ssz = { package = "ethereum_ssz", version = "0.9" }

# Async runtime
async-trait = { workspace = true }
futures = "0.3"
tokio = { workspace = true, features = ["sync", "time"] }

# Caching
caches = "0.2"

# Utils
governor = "0.10"
rand = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

# CLI and serialization (for binaries)
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { workspace = true, features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
toml = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[lints]
workspace = true
