[package]
name         = "emerald-simplex"
version      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
rust-version = { workspace = true }
publish      = { workspace = true }

[features]
default = [  ]

[[bin]]
name = "emerald-simplex"
path = "src/bin/validator.rs"

[[bin]]
name = "emerald-simplex-setup"
path = "src/bin/setup.rs"

[dependencies]
# Emerald dependencies - reuse existing infrastructure
malachitebft-eth-cli   = { workspace = true }
malachitebft-eth-types = { workspace = true }

# Commonware dependencies for simplex consensus
commonware-broadcast    = { version = "0.0.65" }
commonware-codec        = { version = "0.0.65" }
commonware-consensus    = { version = "0.0.65" }
commonware-cryptography = { version = "0.0.65" }
commonware-p2p          = { version = "0.0.65" }
commonware-resolver     = { version = "0.0.65" }
commonware-runtime      = { version = "0.0.65" }
commonware-storage      = { version = "0.0.65" }
commonware-utils        = { version = "0.0.65" }
commonware-parallel     = { version = "0.0.65" }
commonware-math         = { version = "0.0.65" }

# Alloy for EVM types
alloy-primitives       = { workspace = true, features = [ "serde" ] }
alloy-eips             = { workspace = true }
alloy-provider         = { version = "1.4.3", features = [ "engine-api" ] }
alloy-rpc-client       = { version = "1.4.3" }
alloy-rpc-types-engine = { workspace = true }
alloy-rpc-types-eth    = { workspace = true }
alloy-rlp              = { version = "0.3" }
alloy-consensus        = { workspace = true }
alloy-transport-http   = { version = "1.4.3", features = [ "hyper", "jwt-auth" ] }

# Serialization
bytes        = { workspace = true }
ethereum_ssz = { version = "0.9" }
serde        = { workspace = true, features = [ "derive" ] }

# Async runtime
futures = { version = "0.3" }
tokio   = { workspace = true, features = [ "sync", "time" ] }

# Caching
caches = { version = "0.2" }

# Utils
governor = { version = "0.10" }
rand     = { workspace = true }
tracing  = { workspace = true }
url      = { workspace = true }

# CLI and config formats (used by binaries)
clap       = { workspace = true, features = [ "derive" ] }
serde_yaml = { version = "0.9" }
toml       = { workspace = true }

[lints]
workspace = true
